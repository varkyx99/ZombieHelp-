<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0606">
<meta name="color-scheme" content="dark">
<title>Caderno de Rounds</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: caderno de campo em abas (estratégias, rotas, tempo, chicletes), coluna única de até 680px, barra de abas fixa embaixo. Ousadia concentrada no cronômetro com faixa de alerta. */
:root{
  --bg:#0a0606;
  --surface:#150c0c;
  --surface-2:#231111;
  --fg:#f1e7dc;
  --muted:#b39c8d;
  --line:#40201b;
  --accent:#ff6a00;
  --accent-ink:#1a0603;
  --accent-text:#ff8a2a;
  --red:#c4161c;
  --good:#8fd14f;
  --bad:#ff5a4a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --stencil:"Black Ops One","Big Shoulders Display",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h2,h3,p{margin:0}

/* cabeçalho */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 12px}
.brand{font:800 28px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.sync{font:500 11px/1.3 var(--mono);color:var(--muted);text-align:right}

/* filtro de mapa */
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.chip{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:500 13px var(--body);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{font-size:13px;color:var(--muted);padding-block:2px 6px}
.link{background:none;border:0;padding:0;min-height:32px;color:var(--accent-text);text-decoration:underline}
.link.danger{color:var(--bad)}

/* barra de abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:680px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;border-radius:8px;color:var(--muted);font:600 11px/1 var(--body)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent-text)}

/* seções e botões */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block:14px 12px}
.sec-h h2{font:800 24px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.sec-h.sub{margin-block:26px 10px}
.sec-h.sub h3{font:700 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--body)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.stack{display:grid;gap:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:22px 16px;display:grid;gap:8px;justify-items:start}
.empty .e-t{font:700 17px var(--body)}
.empty p{color:var(--muted);max-width:52ch}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.card h3{font:700 17px/1.25 var(--body);margin-block:8px 6px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 11px/1 var(--mono);padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.tag.map{color:var(--accent-text);border-color:var(--accent-text)}
.tag.ex{border-style:dashed}
.tag.best{color:var(--good);border-color:var(--good);margin-left:8px;font-style:normal}
.plan{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.muted{color:var(--muted)}

/* estratégias */
.strat{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px}
.plate{align-self:start;display:grid;justify-items:center;gap:2px;padding:10px 4px;background:var(--surface-2);border-radius:6px}
.plate small{font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--muted)}
.plate b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.plate b.long{font-size:21px}
.cover-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px 10px;margin-bottom:12px}
.cover{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--g,2px);height:14px}
.cover i{background:var(--surface-2);border-radius:1px}
.cover i.on{background:var(--accent)}
.ticks{position:relative;height:18px;font:500 10px/1 var(--mono);color:var(--muted)}
.ticks span{position:absolute;top:5px;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.cover-cap{font-size:13px;color:var(--muted)}

/* rotas */
.r-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prog{font:600 13px var(--mono);color:var(--muted);padding-top:4px}
.path{list-style:none;margin:14px 0 0;padding:0}
.step{position:relative;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:18px;top:38px;bottom:0;width:2px;background:var(--line)}
.node{width:38px;height:38px;border-radius:50%;border:2px solid var(--fg);background:var(--surface);font:600 14px var(--mono);color:var(--fg);padding:0}
.step.done .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.done .st-body{opacity:.6}
.st-p{font-weight:600;overflow-wrap:anywhere;padding-top:7px}
.st-a{color:var(--muted);overflow-wrap:anywhere}

/* cronômetro */
.clock{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.clock::before{content:"";display:block;height:10px;background:repeating-linear-gradient(135deg,var(--accent) 0 10px,var(--bg) 10px 20px)}
.clock .in{padding:16px;display:grid;gap:14px}
.c-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cap{display:block;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rno{font:800 44px/1 var(--display);font-variant-numeric:tabular-nums}
.c-meta{display:grid;gap:6px;justify-items:end;text-align:right;font:500 12px var(--mono);color:var(--muted)}
.big{font:600 clamp(52px,17vw,84px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock.paused .big{opacity:.5}
.c-sub{display:flex;gap:16px;align-items:baseline;font:500 14px var(--mono);color:var(--muted)}
.c-sub b{color:var(--fg);font-weight:600}
.pz{color:var(--accent-text);font-weight:600;letter-spacing:.1em}
.next{min-height:68px;font:800 24px var(--display);letter-spacing:.06em;text-transform:uppercase}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .btn{padding:0 6px}
.hint{font-size:13px;color:var(--muted)}
.splits{display:grid;border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.split span:first-child{color:var(--muted)}
.fast{color:var(--good)}
.slow{color:var(--bad)}
.run{padding:0}
.run summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;min-height:56px}
.run summary::-webkit-details-marker{display:none}
.r-no{font:800 26px/1 var(--display);min-width:46px}
.r-main{display:grid;min-width:0}
.r-main b{overflow-wrap:anywhere}
.r-main small{color:var(--muted)}
.r-tot{font:600 15px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px}
.run[open] .chev{transform:rotate(-135deg);margin-top:4px}
.r-body{padding:0 14px 14px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.splits-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
.splits-grid span{background:var(--surface-2);border-radius:4px;padding:5px 8px}
.splits-grid b{color:var(--muted);font-weight:500;margin-right:4px}

/* chicletes */
.g-row{display:grid;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.g-row:first-of-type{border-top:0}
.g-n{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.g-n b{overflow-wrap:anywhere}
.g-n small{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.bar{display:flex;height:8px;border-radius:2px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block}
.g-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g-h b{font-size:16px;overflow-wrap:anywhere}
.pill{font:600 12px/1 var(--body);padding:6px 9px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.pill.ajudou{color:var(--good)}
.pill.neutro{color:var(--muted)}
.pill.nao{color:var(--bad)}

/* formulários */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(5,8,12,.6)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:12px}}
.sheet.sq{align-items:center;padding:0 12px}
.sheet.sq .panel{width:min(100%,560px);max-height:88%;border-radius:14px}
button,[data-act],summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.panel h2{font:800 24px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
label{display:grid;gap:6px;font:500 12px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;font:16px/1.4 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px;letter-spacing:0;text-transform:none}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-weight:500;min-height:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{position:relative;display:block;font:inherit;letter-spacing:0;text-transform:none}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:600 13px var(--body);color:var(--fg);text-align:center}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt input:focus-visible+span{outline:2px solid var(--accent-text);outline-offset:2px}
.steps-h{font:700 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#steps{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.sn{font:600 13px var(--mono);color:var(--muted);padding-top:12px}
.sf{display:grid;gap:8px;min-width:0}
.sf input{background:var(--surface)}
.sbtn{display:grid;gap:4px}
.ib{width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0;font-size:15px}
/* pack de chicletes */
.pack{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.pk-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pk-h h3{font:800 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.modes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{display:grid;gap:2px;justify-items:center;align-content:start;min-width:0}
.pt{position:relative;width:100%;aspect-ratio:1/1;padding:0;border:2px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.pt.blank{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--muted);font-size:28px}
.pt.m-x{border-color:var(--bad)}
.pt.m-ok{border-color:var(--good)}
.pt .gt-img,.pt .gt-ph{border-radius:0;height:100%}
.pn{position:absolute;left:4px;top:4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:rgba(0,0,0,.7);color:#fff;font:700 11px/18px var(--mono);text-align:center;pointer-events:none}
.mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 44px/1 var(--display);color:#fff}
.pt.m-x .mk{background:rgba(179,54,43,.68)}
.pt.m-ok .mk{background:rgba(31,122,77,.68)}
.gt-img,.gt-ph{display:block;width:100%;aspect-ratio:1/1;border-radius:8px;object-fit:cover}
.gt-ph{display:flex;align-items:center;justify-content:center;font:800 24px/1 var(--display);letter-spacing:.04em;color:#fff}
.sname,.ln{font:500 11px/1.25 var(--body);text-align:center;overflow-wrap:anywhere;max-width:100%}
.sname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot .link{font-size:12px;min-height:30px}
.pk-msg{min-height:1.5em;color:var(--accent-text);font-weight:600}
.pk-foot{display:flex;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted)}
.pk-foot b{color:var(--fg)}
.pk-foot .link{font-size:12px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.lib-t{display:grid;gap:4px;justify-items:center;align-content:start;padding:6px;border:2px solid transparent;border-radius:12px;background:none;text-align:center}
.lib-t.sel{border-color:var(--accent)}
.lib-form{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;font:600 14px/1.2 var(--body);letter-spacing:0;text-transform:none;color:var(--accent-ink);cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent-text);outline-offset:2px}
.pack+.clock{margin-top:12px}
.cat-list{display:grid}
.cat-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat-t{width:48px;height:48px;font-size:16px;border-radius:8px;flex:none}
.cat-i{display:grid;gap:2px;min-width:0}
.cat-i b{overflow-wrap:anywhere}
.cat-i small{color:var(--muted);font:500 11px var(--mono)}
.cat-i span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
body.hud{padding-block:0 24px}
.hud .top,.hud .tabs{display:none}
.hud #app{display:grid;gap:12px;padding-top:12px}
.hud-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hud-time{text-align:right}
.hud-top .big{font-size:clamp(40px,13vw,64px)}
.hud-top .rno{font-size:56px}
.hud-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.perks{display:grid;gap:10px}
.perk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.perk{display:grid;justify-items:center;align-content:start;gap:4px;min-width:0;min-height:40px;padding:6px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:600 12px/1.15 var(--body);color:var(--muted);text-align:center}
.perk .pk-i{width:44px;height:44px;border-radius:8px;object-fit:cover;display:block;opacity:.55}
.perk.on .pk-i{opacity:1}
.perk .pk-ph{display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font:800 20px var(--display)}
.perk .pk-n{overflow-wrap:anywhere;hyphens:auto}
.pk-rows{display:grid;gap:10px;margin:8px 0 12px}
.pk-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px}
.pk-pic .gt-img,.pk-pic .gt-ph{width:64px;height:64px;aspect-ratio:auto}
.pk-none{display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:11px;text-align:center}
.pk-fields{display:grid;gap:6px;min-width:0}
.pk-fields input[type=file]{font-size:13px;max-width:100%}
.pk-acts{display:flex;gap:12px;flex-wrap:wrap}
.perk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.map-pick{margin-top:12px}
.map-t .ln b{font-weight:600}
select{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:500 15px var(--body)}
.vtoast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);opacity:0;pointer-events:none;z-index:40;max-width:min(92vw,420px);padding:10px 16px;border-radius:22px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--body);text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.4);transition:opacity .15s,transform .15s}
.vtoast.show{opacity:1;transform:translate(-50%,0)}
.voice-b.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vhelp{display:grid;gap:6px;margin:0;padding-left:18px;font-size:14px}
.launch{display:grid;gap:8px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);text-align:left;min-height:64px}
.launch .lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.launch .lh b{font:800 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.launch-map{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:6px;display:block}
.mini-row.perks-row{grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.perk-slots{margin:4px 0}
.mini-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mini{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;border:2px solid var(--line);background:var(--bg);display:block}
.mini .gt-img,.mini .gt-ph{height:100%;border-radius:0;font-size:14px}
.mini.blank{display:grid;place-items:center;border-style:dashed;color:var(--muted);font-size:20px}
.mini.m-x{border-color:var(--bad)}.mini.m-ok{border-color:var(--good)}

function applyPresets(o,d){

    o.strategies=o.strategies.concat(PRESET_KINO.filter(function(x){return !have[x.id]}).map(function(x){return JSON.parse(JSON.stringify(x))}));
    o.presets.push('kino-furney-1');
  }
  return o;
}

/* imagens dos chicletes: guardadas à parte (cada imagem é pequena e vira um documento próprio na conta) */
var LSI='caderno-rounds-img-v1',imgs={};
try{imgs=JSON.parse(localStorage.getItem(LSI)||'{}')||{}}catch(e){imgs={}}
var IDB=null,imgFailAt=0;
function imgFail(){
  if(Date.now()-imgFailAt<4000)return;
  imgFailAt=Date.now();
  toast('Não foi possível guardar a imagem neste aparelho (sem espaço). Apague imagens que não usa.');
}
function saveImgsLocal(){if(IDB)return;try{localStorage.setItem(LSI,JSON.stringify(imgs))}catch(e){imgFail()}}
function idbOpen(){return new Promise(function(res){
  try{
    var rq=indexedDB.open('caderno-rounds',1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore('imgs')};
    rq.onsuccess=function(){res(rq.result)};
    rq.onerror=function(){res(null)};rq.onblocked=function(){res(null)};
  }catch(e){res(null)}
})}
function idbPut(k,v){
  try{var tx=IDB.transaction('imgs','readwrite');tx.objectStore('imgs').put(v,k);tx.onerror=imgFail;tx.onabort=imgFail}catch(e){imgFail()}
}
function idbDel(k){try{IDB.transaction('imgs','readwrite').objectStore('imgs').delete(k)}catch(e){}}
function idbLoad(){return new Promise(function(res){
  try{
    var o={},cur=IDB.transaction('imgs').objectStore('imgs').openCursor();
    cur.onsuccess=function(){var c=cur.result;if(c){o[c.key]=c.value;c.continue()}else res(o)};
    cur.onerror=function(){res({})};
  }catch(e){res({})}
})}
idbOpen().then(function(db){
  if(!db)return;
  IDB=db;
  return idbLoad().then(function(o){
    var changed=false;
    Object.keys(o).forEach(function(k){if(typeof o[k]==='string'&&!imgs[k]){imgs[k]=o[k];changed=true}});
    Object.keys(imgs).forEach(function(k){if(!(k in o))idbPut(k,imgs[k])});
    try{localStorage.removeItem(LSI)}catch(e){}
    if(changed&&sheet.hidden)render();
  });
});
function putImg(gid,u){
  imgs[gid]=u;if(IDB)idbPut(gid,u);else saveImgsLocal();
  if(ref)ref.collection('imgs').doc(gid).set({u:u}).catch(function(){setSync('err')});
}
function delImg(gid){
  delete imgs[gid];if(IDB)idbDel(gid);else saveImgsLocal();
  if(ref)ref.collection('imgs').doc(gid).delete().catch(function(){});
}
function toThumb(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej()};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej()};
      im.onload=function(){
        var S=160,c=document.createElement('canvas');c.width=S;c.height=S;
        var x=c.getContext('2d'),m=Math.min(im.width,im.height);
        x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
        var u=c.toDataURL('image/webp',.85);
        if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/jpeg',.88);
        res(u);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- salvamento ---------- */
var ref=null,saving=false,dirty=false,saveTm=0,armTm=0;
function setSync(k){
  var t={local:'Salvo neste aparelho',saving:'Salvando…',ok:'Salvo na sua conta',err:'Sem conexão com a conta. Cópia salva neste navegador.'}[k];
  var el=$('#sync');if(el)el.textContent=t;
}
function touch(){
  ui.touched=true;saveLocal();dirty=true;
  setSync(ref?'saving':'local');
  clearTimeout(saveTm);saveTm=setTimeout(flush,500);
}
async function flush(){
  if(!ref){dirty=false;setSync('local');return}
  if(saving)return;
  saving=true;
  while(dirty){
    dirty=false;
    try{await ref.set(JSON.parse(JSON.stringify(st)));setSync('ok')}
    catch(e){setSync('err')}
  }
  saving=false;
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    var parts=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    var db=parts[0],user=parts[1];
    if(!db||!user)return;
    var id=await user.id();
    if(!id)return;
    ref=db.doc('data/users/'+id+'/caderno');
    var snap=await ref.get();
    if(snap.exists){st=norm(snap.data());saveLocal();if(sheet.hidden)render();setSync('ok')}
    else{dirty=true;await flush()}
    syncImgs();
  }catch(e){ref=null;setSync('local')}
}
async function syncImgs(){
  try{
    var snap=await ref.collection('imgs').get();
    var have={};
    snap.docs.forEach(function(d){var v=d.data();if(v&&v.u){if(imgs[d.id]!==v.u){imgs[d.id]=v.u;if(IDB)idbPut(d.id,v.u)}have[d.id]=1}});
    saveImgsLocal();
    if(sheet.hidden)render();
    var ids=Object.keys(imgs).filter(function(g){return !have[g]&&(g.indexOf('mp_')===0||st.gumLib.some(function(x){return x.id===g}))});
    for(var i=0;i<ids.length;i++){await ref.collection('imgs').doc(ids[i]).set({u:imgs[ids[i]]})}
  }catch(e){}
}
async function pull(){
  if(!ref||saving||dirty||!sheet.hidden)return;
  try{
    var snap=await ref.get();
    if(snap.exists&&!dirty&&JSON.stringify(norm(snap.data()))!==JSON.stringify(st)){st=norm(snap.data());saveLocal();render();syncImgs()}
  }catch(e){}
}

function fmt(ms){
  var s=Math.floor(Math.max(0,ms)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  var p=function(n){return String(n).padStart(2,'0')};
  return h?h+':'+p(m)+':'+p(x):m+':'+p(x);
}
function fdate(iso){try{return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}catch(e){return ''}}

}

function hasExamples(){return [].concat(st.strategies,st.routes,st.gums).some(function(x){return x.example})}

function cover(list){
  var max=Math.max.apply(null,[30].concat(list.map(function(s){return s.to})));
  var on=[];for(var i=0;i<=max;i++)on.push(false);
  list.forEach(function(s){for(var r=s.from;r<=s.to;r++)on[r]=true});
  var cells='',gaps=[],start=0;
  for(var r=1;r<=max;r++){
    cells+='<i class="'+(on[r]?'on':'')+'"></i>';
    if(!on[r]&&!start)start=r;
    if(start&&(on[r]||r===max)){var end=on[r]?r-1:r;gaps.push(start===end?String(start):start+'–'+end);start=0}
  }
  var ticks='<span style="left:0">1</span>';
  for(var k=10;k<=max;k+=10)ticks+='<span style="left:'+((k-1)/max*100)+'%">'+k+'</span>';
  var cap=gaps.length?'Sem plano nos rounds '+gaps.slice(0,4).join(', ')+(gaps.length>4?'…':''):'Todos os rounds até '+max+' têm plano.';
  return '<div class="cover-wrap"><div class="cover" style="--n:'+max+';--g:'+(max>50?1:2)+'px" role="img" aria-label="'+esc(cap)+'">'+cells+'</div><div class="ticks" aria-hidden="true">'+ticks+'</div><p class="cover-cap">'+esc(cap)+'</p></div>';
}
function stratCard(s){
  var rng=s.from===s.to?String(s.from):s.from+'–'+s.to;
  return '<article class="card strat"><div class="plate"><small>ROUND</small><b class="'+(rng.length>5?'long':'')+'">'+rng+'</b></div><div style="min-width:0">'+
    '<div class="meta"><span class="tag map">'+esc(s.map)+'</span>'+exTag(s)+arr(s.tags).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div>'+
    '<h3>'+esc(s.title)+'</h3>'+(s.plan?'<p class="plan">'+esc(s.plan)+'</p>':'')+
    '<div class="acts"><button class="btn sm ghost" data-act="edit-est" data-id="'+s.id+'">Editar</button>'+delBtn('strategies',s.id)+'</div></div></article>';
}
function viewEst(){
  var list=st.strategies.filter(inMap).sort(function(a,b){return (a.map||'').localeCompare(b.map||'','pt')||a.from-b.from||a.to-b.to});
  var h='<div class="sec-h"><h2>Estratégias de rounds</h2><button class="btn primary" data-act="new-est">Nova</button></div>';
  if(ui.map&&list.length)h+=cover(list);
  if(!list.length)return h+empty('Nenhuma estratégia ainda','Anote o que fazer em cada faixa de rounds: onde ficar, quando comprar, quando trocar de tática.','new-est','Criar a primeira estratégia');
  return h+'<div class="stack">'+list.map(stratCard).join('')+'</div>';
}

function routeCard(r){
  var done=r.steps.filter(function(s){return s.done}).length;
  var steps=r.steps.length?'<ol class="path">'+r.steps.map(function(s,i){
    return '<li class="step'+(s.done?' done':'')+'"><button type="button" class="node" data-act="tick" data-id="'+r.id+'" data-i="'+i+'" aria-pressed="'+(!!s.done)+'" aria-label="Marcar parada '+(i+1)+': '+esc(s.place)+'">'+(s.done?'✓':(i+1))+'</button>'+
      '<div class="st-body"><div class="st-p">'+esc(s.place)+(s.round?' <span class="tag">R'+s.round+'</span>':'')+'</div>'+(s.action?'<div class="st-a">'+esc(s.action)+'</div>':'')+'</div></li>';
  }).join('')+'</ol>':'<p class="muted" style="margin-top:12px">Sem paradas. Edite a rota para adicionar.</p>';
  return '<article class="card"><div class="r-h"><div style="min-width:0"><div class="meta"><span class="tag map">'+esc(r.map)+'</span>'+exTag(r)+'</div><h3>'+esc(r.name)+'</h3></div><span class="prog">'+done+'/'+r.steps.length+'</span></div>'+steps+
    '<div class="acts"><button class="btn sm ghost" data-act="edit-route" data-id="'+r.id+'">Editar</button>'+(done?'<button class="btn sm ghost" data-act="reset-route" data-id="'+r.id+'">Zerar marcações</button>':'')+delBtn('routes',r.id)+'</div></article>';
}
function viewRotas(){
  var list=st.routes.filter(inMap).sort(function(a,b){return (a.map||'').localeCompare(b.map||'','pt')||a.name.localeCompare(b.name,'pt')});
  var h='<div class="sec-h"><h2>Rotas</h2><button class="btn primary" data-act="new-route">Nova</button></div>';
  if(!list.length)return h+empty('Nenhuma rota ainda','Monte a ordem das paradas e marque cada uma durante a partida.','new-route','Criar a primeira rota');
  return h+'<div class="stack">'+list.map(routeCard).join('')+'</div>';
}

function clockStart(){
  return '<div class="clock"><div class="in">'+
    '<p class="err" id="t-err" role="alert"></p><button class="btn primary next" data-act="t-start">Iniciar partida em '+esc(ui.startMap)+'</button><div class="row2"><button type="button" class="btn ghost" data-act="start-back">Trocar mapa</button><button type="button" class="btn ghost" data-act="perks-edit">Perks</button></div>'+voiceBtn()+
    '<p class="hint">Ao iniciar, abre o modo partida com round, tempo, chicletes, perks e mapa. As marcas do pack e dos perks começam zeradas. Toque em “Próximo round” quando cada round terminar; o cronômetro continua contando se você fechar a página. Para ver tudo lado a lado, gire o celular para a horizontal (com a rotação automática ligada).</p></div></div>';
}
function clockLive(t){
  var best=bestRun(t.map);
  var rows=t.splits.map(function(ms,i){return {r:i+1,ms:ms}}).reverse().map(function(x){
    var b=best&&best.splits[x.r-1],d=(b!=null)?x.ms-b:null;
    return '<div class="split"><span>R'+x.r+'</span><span>'+fmt(x.ms)+'</span><span class="'+(d==null?'':d<=0?'fast':'slow')+'">'+(d==null?'':(d<=0?'−':'+')+fmt(Math.abs(d)))+'</span></div>';
  }).join('');
  var armed=ui.armed==='discard';
  return '<div class="clock'+(t.pausedAt?' paused':'')+'"><div class="in">'+
    '<button type="button" class="btn ghost" data-act="hud-open">Abrir modo partida</button>'+'<div class="c-top"><div><span class="cap">Round atual</span><div class="rno">'+t.round+'</div></div><div class="c-meta"><span class="tag map">'+esc(t.map)+'</span>'+(best?'<span>Melhor: R'+best.round+' em '+fmt(best.total)+'</span>':'')+'</div></div>'+
    '<div class="big" id="t-round">0:00</div>'+
    '<div class="c-sub"><span>Total <b id="t-total">0:00</b></span>'+(t.pausedAt?'<span class="pz">PAUSADO</span>':'')+'</div>'+
    '<button class="btn primary next" data-act="t-next">Próximo round</button>'+
    '<div class="row3"><button class="btn ghost" data-act="t-pause">'+(t.pausedAt?'Retomar':'Pausar')+'</button><button class="btn ghost" data-act="t-back"'+(t.splits.length?'':' disabled')+'>Voltar round</button><button class="btn ghost" data-act="t-finish">Finalizar</button></div>'+
    (rows?'<div class="splits" aria-label="Tempo de cada round">'+rows+'</div>':'')+
    '<div><button class="link danger" data-act="t-discard">'+(armed?'Confirmar: descartar esta run':'Descartar run')+'</button></div></div></div>';
}
function runCard(run){
  var best=bestRun(run.map),isBest=best&&best.id===run.id;
  var avg=run.splits.length?run.total/run.splits.length:0;
  return '<details class="card run" data-id="'+run.id+'"'+(ui.open.has(run.id)?' open':'')+'><summary><span class="r-no">R'+run.round+'</span><span class="r-main"><b>'+esc(run.map)+'</b><small>'+fdate(run.date)+'</small></span><span class="r-tot">'+fmt(run.total)+(isBest?'<em class="tag best">melhor</em>':'')+'</span><span class="chev" aria-hidden="true"></span></summary>'+
    '<div class="r-body"><p class="muted">Média por round: '+fmt(avg)+'</p><div class="splits-grid">'+run.splits.map(function(ms,i){return '<span><b>R'+(i+1)+'</b>'+fmt(ms)+'</span>'}).join('')+'</div>'+
    '<label for="n-'+run.id+'">Anotação<textarea id="n-'+run.id+'" data-note="'+run.id+'" rows="3" placeholder="O que funcionou, onde perdeu tempo">'+esc(run.note||'')+'</textarea></label>'+
    '<div class="acts" style="margin:0">'+delBtn('runs',run.id)+'</div></div></details>';
}

function parseT(x){var ms=0;String(x).split(':').forEach(function(p){ms=ms*60+(+p||0)});return ms*1000}
function wrFor(map,n){
  var w=WR[String(map||'').trim()];
  if(!w)return null;
  if(n===30)return {ms:parseT(w[0]),txt:w[0],who:w[1]};
  if(n===50)return {ms:parseT(w[2]),txt:w[2],who:w[3]};
  return null;
}
function fdiff(ms){return (ms<0?'−':'+')+fmt(Math.abs(ms))}
function recMaps(){
  var set={},out=[];
  var add=function(n){if(n&&!set[n]){set[n]=1;out.push(n)}};
  st.runs.forEach(function(r){add(r.map)});
  Object.keys(st.records||{}).forEach(add);
  return out.filter(function(m){return !ui.map||m===ui.map});
}
function recCard(map,only){
  var R=(st.records||{})[map]||{maxRound:0,best:0,t:{}};
  var runs=st.runs.filter(function(x){return x.map===map});
  var rows=CHK.filter(function(n){return R.t[n]||wrFor(map,n)}).map(function(n){
    var me=R.t[n],w=wrFor(map,n);
    var d='',bar='';
    if(w){
      if(me){
        var df=me-w.ms;
        d='<span class="'+(df<=0?'up':'dn')+'">'+fdiff(df)+'</span>';
        bar='<span class="rbar" aria-hidden="true"><i style="width:'+Math.max(4,Math.min(100,Math.round(w.ms/me*100)))+'%"></i></span>';
      }else d='<span class="muted">ainda não chegou</span>';
    }
    return '<div class="rrow"><b>R'+n+'</b><span>'+(me?fmt(me):'—')+'</span><span>'+(w?w.txt+'<small>'+esc(w.who)+'</small>':'—')+'</span><span>'+d+'</span>'+bar+'</div>';
  }).join('');
  var last=runs.slice(0,6);
  var cols=[10,20,30];
  var bestCol={};
  cols.forEach(function(n){var m=0;last.forEach(function(r){var v=atRound(r,n);if(v!=null&&(!m||v<m))m=v});bestCol[n]=m});
  var cmp=last.length>1?'<div class="cmp-h">Comparação entre as últimas partidas</div><div class="cmp"><div class="cmp-r hd"><span>Data</span><span>Round</span><span>Total</span><span>R10</span><span>R20</span><span>R30</span></div>'+last.map(function(r){
    return '<div class="cmp-r"><span>'+fdate(r.date)+'</span><span'+(r.round===R.maxRound?' class="best"':'')+'>R'+r.round+'</span><span'+(R.best&&r.total===R.best&&r.round===R.maxRound?' class="best"':'')+'>'+fmt(r.total)+'</span>'+cols.map(function(n){var v=atRound(r,n);return '<span'+(v!=null&&v===bestCol[n]?' class="best"':'')+'>'+(v!=null?fmt(v):'—')+'</span>'}).join('')+'</div>';
  }).join('')+'</div>':'';
  var id='rec-'+mapKey(map);
  return '<details class="card rec" data-id="'+id+'"'+((ui.open.has(id)||only)?' open':'')+'><summary><span class="r-no">★'+(R.maxRound||'–')+'</span><span class="r-main"><b>'+esc(map)+'</b><small>'+runs.length+(runs.length===1?' partida salva':' partidas salvas')+(R.best?' · melhor '+fmt(R.best):'')+'</small></span><span class="chev" aria-hidden="true"></span></summary>'+
    '<div class="r-body"><div class="rrow hd"><b></b><span>Você</span><span>Speedrunner</span><span>Diferença</span></div>'+(rows||'<p class="muted">Termine uma partida passando do round 10 para registrar tempos.</p>')+cmp+'</div></details>';
}
function viewRecords(){
  var ms=recMaps();
  var h='<div class="sec-h sub"><h3>Recordes e comparação</h3></div>';
  if(!ms.length)return h+'<p class="muted">Quando você finalizar uma partida, aqui ficam o seu melhor round, os melhores tempos por round e a diferença para os speedrunners'+(ui.map?' deste mapa':'')+'. O recorde fica salvo mesmo se você apagar a run.</p>';
  return h+'<div class="stack">'+ms.map(function(m){return recCard(m,ms.length===1)}).join('')+'</div>'+
    '<p class="hint" style="margin-top:8px">Speedrunners: melhores tempos solo de round 30 e 50 no zwr.gg, consultados em 10/10/2026. “R30” é o tempo até começar o round 30. Os recordes mudam, e cada categoria tem regras próprias (chicletes, versão do jogo), então use como referência de ritmo.</p>';
}
function viewTempo(){
  var t=st.timer;
  var h=(!t&&ui.finMsg?'<div class="card fin" id="fin-msg" role="status"><b>Partida finalizada.</b><p>'+esc(ui.finMsg)+'</p><div class="btns" style="justify-content:flex-start"><button type="button" class="btn sm ghost" data-act="fin-ok">Ok</button></div></div>':'')+'<div class="sec-h"><h2>Partida</h2></div>'+(t?viewPack()+clockLive(t):(ui.startMap?viewStartMap()+viewPack()+clockStart():viewMapPick()));
  var runs=st.runs.filter(inMap);
  h+=viewRecords();
  h+='<div class="sec-h sub"><h3>Runs salvas</h3></div>';
  if(!runs.length)return h+'<p class="muted">Nenhuma run salva'+(ui.map?' neste mapa':'')+'. Ao finalizar uma run, os tempos de cada round ficam aqui para comparar.</p>';
  return h+'<div class="stack">'+runs.map(runCard).join('')+'</div>';
}

  h+='<div class="sec-h sub"><h3>Histórico</h3></div><div class="stack">'+list.map(function(x){
    return '<article class="card"><div class="g-h"><b>'+esc(x.name)+'</b><span class="pill '+esc(x.result)+'">'+(RES[x.result]||'')+'</span></div>'+
      '<div class="meta" style="margin-top:8px"><span class="tag map">'+esc(x.map)+'</span>'+(x.round?'<span class="tag">Round '+x.round+'</span>':'')+'<span class="tag">'+fdate(x.date)+'</span>'+exTag(x)+'</div>'+

      '<div class="acts"><button class="btn sm ghost" data-act="edit-gum" data-id="'+x.id+'">Editar</button>'+delBtn('gums',x.id)+'</div></article>';
  }).join('')+'</div>';

function libGum(id){return id?st.gumLib.find(function(x){return x.id===id}):null}
function packComplete(){return st.pack.slots.every(function(s){return s.gid&&s.mark})}
var packTm=0;
function checkPack(){
  if(packComplete()){
    if(!packTm)packTm=setTimeout(function(){
      packTm=0;
      if(!packComplete())return;
      st.pack.slots.forEach(function(s){s.mark=''});
      st.pack.cycles++;
      ui.packMsg='Pack completo. As marcas foram reiniciadas.';
      touch();render();
      setTimeout(function(){ui.packMsg='';if(ui.tab==='tempo'||ui.hud)render()},4000);
    },900);
  }else if(packTm){clearTimeout(packTm);packTm=0}
}

function inLib(en){return st.gumLib.some(function(g){return g.cid===en})}
function addCat(i){
  var c=GUMS[i];
  if(!c||inLib(c[1]))return false;
  st.gumLib.push({id:uid(),name:c[2],en:c[1],cat:c[0],fx:c[3],cid:c[1]});
  return true;
}
function normKey(t){return String(t).toLowerCase().replace(/[^a-z0-9à-ÿ]/g,'')}
function matchCat(name){

  for(var i=0;i<GUMS.length;i++){if(k===normKey(GUMS[i][1])||k===normKey(GUMS[i][2]))return i}

function mapArt(name){
  var k=vnorm(name);
  if(ARTC[k])return ARTC[k];
  var sc=ART_SCENES[ART_MAP[k]]||ART_SCENES.generic;
  return (ARTC[k]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sc()));
}

function mapKey(n){
  var h=0;n=String(n).toLowerCase().trim();
  for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
  return 'mp_'+h.toString(36);
}
function toMapImg(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej()};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej()};
      im.onload=function(){
        var q=0.72,max=1000,u='';
        for(var k=0;k<5;k++){
          var sc=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
          var c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(im,0,0,w,h);
          u=c.toDataURL('image/jpeg',q);
          if(u.length<225000)break;
          q=Math.max(0.4,q-0.08);max=Math.round(max*0.8);
        }
        if(u.length>=240000)rej();else res(u);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

var mv={s:1,tx:0,ty:0,bw:0,bh:0,w:0,h:0};
function mvApply(){
  var wrap=$('#mapwrap');if(!wrap)return;
  var cw=mv.w*mv.s,ch=mv.h*mv.s;
  mv.tx=cw<=mv.bw?(mv.bw-cw)/2:Math.min(0,Math.max(mv.bw-cw,mv.tx));
  mv.ty=ch<=mv.bh?(mv.bh-ch)/2:Math.min(0,Math.max(mv.bh-ch,mv.ty));
  wrap.style.transform='translate('+mv.tx+'px,'+mv.ty+'px) scale('+mv.s+')';
  wrap.style.setProperty('--inv',String(1/mv.s));
  var z=$('#mz');if(z)z.textContent=Math.round(mv.s*100)+'%';
}
function mvFit(keep){
  var box=$('#mapbox'),img=$('#mapimg'),wrap=$('#mapwrap');
  if(!box||!img||!wrap||!img.naturalWidth)return;
  var r=box.getBoundingClientRect();
  mv.bw=r.width;mv.bh=r.height;
  var f=Math.min(mv.bw/img.naturalWidth,mv.bh/img.naturalHeight);
  mv.w=img.naturalWidth*f;mv.h=img.naturalHeight*f;
  wrap.style.width=mv.w+'px';wrap.style.height=mv.h+'px';
  if(!keep){mv.s=1;mv.tx=0;mv.ty=0}
  mvApply();
}
function mvZoomAt(cx,cy,ns){
  ns=Math.max(1,Math.min(8,ns));
  var px=(cx-mv.tx)/mv.s,py=(cy-mv.ty)/mv.s;
  mv.s=ns;mv.tx=cx-px*ns;mv.ty=cy-py*ns;
  mvApply();
}
function mvZoomBtn(f){mvZoomAt(mv.bw/2,mv.bh/2,mv.s*f)}

  mm.pins.push({id:uid(),x:Math.round(px*10)/10,y:Math.round(py*10)/10,t:lab.slice(0,40)});
  if(pt)pt.value='';
  touch();redrawPins();render();
}
function initMapView(){
  var box=$('#mapbox'),img=$('#mapimg');
  if(!box||!img)return;
  var ptrs={},moved=0,multi=false;
  var pos=function(e){var r=box.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  box.addEventListener('pointerdown',function(e){
    try{box.setPointerCapture(e.pointerId)}catch(x){}
    ptrs[e.pointerId]=pos(e);
    if(Object.keys(ptrs).length===1){moved=0;multi=false}else multi=true;
  });
  box.addEventListener('pointermove',function(e){
    var old=ptrs[e.pointerId];
    if(!old)return;
    var np=pos(e),keys=Object.keys(ptrs);
    if(keys.length>=2){
      var ok=keys.filter(function(k){return +k!==e.pointerId})[0],o=ptrs[ok];
      var oldD=Math.hypot(old.x-o.x,old.y-o.y),newD=Math.hypot(np.x-o.x,np.y-o.y);
      var oldM={x:(old.x+o.x)/2,y:(old.y+o.y)/2},newM={x:(np.x+o.x)/2,y:(np.y+o.y)/2};
      ptrs[e.pointerId]=np;
      if(oldD>8&&newD>8){
        var ns=Math.max(1,Math.min(8,mv.s*newD/oldD)),cx=(oldM.x-mv.tx)/mv.s,cy=(oldM.y-mv.ty)/mv.s;
        mv.s=ns;mv.tx=newM.x-cx*ns;mv.ty=newM.y-cy*ns;
        mvApply();
      }
    }else{
      var dx=np.x-old.x,dy=np.y-old.y;
      ptrs[e.pointerId]=np;
      moved+=Math.abs(dx)+Math.abs(dy);
      mv.tx+=dx;mv.ty+=dy;mvApply();
    }
  });
  var up=function(e){
    if(!ptrs[e.pointerId])return;
    var single=Object.keys(ptrs).length===1;

var addStat={upd:0,neu:0};
function scoreKey(k,key){
  if(key.length<4)return 0;
  if(k===key)return 1000+key.length;
  if(k.indexOf(key)>=0)return key.length;
  if(k.length>=6&&key.indexOf(k)>=0)return k.length/2;
  return 0;
}
function bestGumFor(name){
  var k=normKey(name),best=null,bs=0;
  if(k.length<3)return null;
  st.gumLib.forEach(function(g){
    [g.name,g.en||'',g.cid||''].forEach(function(x){var sc=scoreKey(k,normKey(x));if(sc>bs){bs=sc;best=g}});
  });
  return best;
}
function bestCatFor(name){
  var k=normKey(name),best=-1,bs=0;
  if(k.length<3)return -1;
  GUMS.forEach(function(c,i){
    [c[1],c[2]].forEach(function(x){var sc=scoreKey(k,normKey(x));if(sc>bs){bs=sc;best=i}});
  });
  return best;
}
async function addFiles(files){
  var n=0;addStat={upd:0,neu:0};
  for(var i=0;i<files.length;i++){
    try{
      var u=await toThumb(files[i]);
      var name=(files[i].name||'Chiclete').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().slice(0,60)||'Chiclete';
      var ex=bestGumFor(name);
      if(ex){putImg(ex.id,u);addStat.upd++}
      else{
        var mi=bestCatFor(name),id=uid();
        if(mi>=0){var c=GUMS[mi];st.gumLib.push({id:id,name:c[2],en:c[1],cat:c[0],fx:c[3],cid:c[1]})}
        else st.gumLib.push({id:id,name:name});
        putImg(id,u);addStat.neu++;
      }
      n++;
    }catch(e){}
  }
  if(n){touch();render()}
  return n;
}

var FAST={'t-next':1,'mark':1,'perk':1,'t-pause':1,'t-back':1,'mode':1},fdn=null,fastAt=0,fastNow=false;
document.addEventListener('pointerdown',function(e){
  fdn=null;
  if(e.pointerType==='mouse'||!e.target.closest)return;
  var el=e.target.closest('[data-act]');
  if(el&&FAST[el.dataset.act])fdn={a:el.dataset.act,i:el.dataset.i||'',n:el.dataset.n||'',x:e.clientX,y:e.clientY,t:Date.now()};
},true);
document.addEventListener('pointerup',function(e){
  var f=fdn;fdn=null;
  if(!f||Math.abs(e.clientX-f.x)+Math.abs(e.clientY-f.y)>14||Date.now()-f.t>900)return;
  var at=document.elementFromPoint(e.clientX,e.clientY),el=at&&at.closest&&at.closest('[data-act]');
  if(!el||el.disabled||el.dataset.act!==f.a||(el.dataset.i||'')!==f.i||(el.dataset.n||'')!==f.n)return;
  fastAt=Date.now();fastNow=true;

},true);

},true);
function act(el){
  var a=el.dataset.act,d=el.dataset,t=st.timer;
  switch(a){
    case 'tab':ui.tab=d.v;ui.armed='';render();window.scrollTo(0,0);break;
    case 'map':ui.map=d.v;render();break;
    case 'close':closeSheet();break;
    case 'new-est':formEst();break;
    case 'edit-est':formEst(d.id);break;
    case 'new-route':formRoute();break;
    case 'edit-route':formRoute(d.id);break;
    case 'new-gum':formGum();break;
    case 'edit-gum':formGum(d.id);break;
    case 'rm-examples':
      ['strategies','routes','gums'].forEach(function(k){st[k]=st[k].filter(function(x){return !x.example})});
      touch();render();break;
    case 'del':
      var key=d.k+':'+d.id;
      if(ui.armed===key){
        if(['strategies','routes','runs','gums'].indexOf(d.k)>=0)st[d.k]=st[d.k].filter(function(x){return x.id!==d.id});
        ui.armed='';touch();render();
      }else{
        ui.armed=key;render();clearTimeout(armTm);armTm=setTimeout(function(){ui.armed='';render()},3500);
      }
      break;
    case 'tick':
      var r=st.routes.find(function(x){return x.id===d.id});
      if(r&&r.steps[+d.i]){r.steps[+d.i].done=!r.steps[+d.i].done;touch();render()}
      break;
    case 'reset-route':
      var rr=st.routes.find(function(x){return x.id===d.id});
      if(rr){rr.steps.forEach(function(s){s.done=false});touch();render()}
      break;
    case 'step-add':syncDraft();draft.steps.push(mkStep());redrawSteps(true);break;
    case 'step-rm':syncDraft();draft.steps.splice(+d.i,1);if(!draft.steps.length)draft.steps.push(mkStep());redrawSteps();break;
    case 'step-up':syncDraft();var i=+d.i;if(i>0){var x=draft.steps[i];draft.steps[i]=draft.steps[i-1];draft.steps[i-1]=x}redrawSteps();break;
    case 'step-down':syncDraft();var j=+d.i;if(j<draft.steps.length-1){var y=draft.steps[j];draft.steps[j]=draft.steps[j+1];draft.steps[j+1]=y}redrawSteps();break;
    case 'mark':
      var sl=st.pack.slots[+d.i];
      if(sl&&sl.gid){sl.mark=(sl.mark===st.pack.mode)?'':st.pack.mode;touch();render()}
      break;
    case 'mode':st.pack.mode=d.v==='ok'?'ok':'x';touch();render();break;
    case 'pack-reset':st.pack.slots.forEach(function(s){s.mark=''});touch();render();break;
    case 'pack-zero':st.pack.cycles=0;touch();render();break;
    case 'pick':formPick(+d.i);break;
    case 'assign':st.pack.slots[+d.i]={gid:d.id,mark:''};touch();closeSheet();render();if(ui.hud)openPop('gums');break;
    case 'clear-slot':st.pack.slots[+d.i]={gid:null,mark:''};touch();closeSheet();render();if(ui.hud)openPop('gums');break;
    case 'lib-list':formLibList();break;
    case 'lib-add':formLib(null,ui.pickSlot);break;
    case 'lib-edit':formLib(d.id,null);break;
    case 'lib-back':if(d.i!==''&&d.i!=null)formPick(+d.i);else formLibList();break;
    case 'lib-del':
      if(el.dataset.armed){
        st.gumLib=st.gumLib.filter(function(x){return x.id!==d.id});
        st.pack.slots.forEach(function(s){if(s.gid===d.id){s.gid=null;s.mark=''}});
        delImg(d.id);touch();render();formLibList();
      }else{
        el.dataset.armed='1';el.textContent='Confirmar exclusão';el.classList.remove('ghost');el.classList.add('danger');
      }
      break;
    case 'hud-open':if(st.timer){ui.hud=true;render();window.scrollTo(0,0)}break;
    case 'hud-close':ui.hud=false;render();window.scrollTo(0,0);break;
    case 'perk':
      if(st.perks.on[d.n])delete st.perks.on[d.n];else st.perks.on[d.n]=true;
      touch();render();break;
    case 'bk-export':
      try{
        var blob=new Blob([JSON.stringify({app:'caderno-de-rounds',v:1,date:new Date().toISOString(),state:st,imgs:imgs})],{type:'application/json'});

function tokSim(a,b){
  if(a===b)return 1;
  if(a.length>=4&&b.length>=4&&(a.indexOf(b)===0||b.indexOf(a)===0))return .8;
  if(a.length>=5&&b.length>=5&&Math.abs(a.length-b.length)<=1){

    while(i<a.length&&j<b.length&&d<=1){

      else{d++;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}
    }
    d+=(a.length-i)+(b.length-j);

  }

function gumScore(qt,g){
  var best=0;
  [g.name,g.en||''].forEach(function(nm){
    var nt=vnorm(nm).split(' ').filter(function(w){return w&&!GFILL[w]&&w.length>1});
    if(!nt.length||!qt.length)return;
    var sum=0;
    qt.forEach(function(w){var b=0;nt.forEach(function(x){var v=tokSim(w,x);if(v>b)b=v});sum+=b});
    var cov=sum/qt.length,rec=sum/nt.length;

    if(sc>best)best=sc;
  });

    if(u){
      if(!st.pack.slots[u-1].gid)return '';
      st.pack.slots[u-1].mark='';touch();render();return 'Chiclete '+u+' sem marca';
    }
  }
  if(m=q.match(/(chiclete|chicletes|goma|gomas|gum) (numero )?(\w+)( (x|xis|confere|certo|ok))?\b/)){
    var n=NUMS[m[3]];
    if(n){
      var sl=st.pack.slots[n-1];
      if(!sl.gid)return 'Espaço '+n+' está vazio';
      var mk=m[5]?((m[5]==='x'||m[5]==='xis')?'x':'ok'):st.pack.mode;
      sl.mark=mk;touch();render();
      return 'Chiclete '+n+(mk==='x'?': X':': confere');
    }
  }
  if(m=q.match(/^(desmarcar|limpar|tirar|desfazer) (.+)/)){
    var gu=voiceGumName(m[2],true);if(gu)return gu;
  }
  if(m=q.match(/^(?:eu )?(?:usei|usou|mastiguei|mascar|marcar|marquei|chiclete|chicletes|goma|gomas|gum) (.+)/)){
    var gm=voiceGumName(m[1],false);if(gm)return gm;
  }
  if(m=q.match(/(perdi|tirar|desmarcar) (o |a )?(perk |bebida )?(.+)/)){
    var pi0=perkByIndex(m[4]),pk0=pi0?pi0.name:voicePerk(m[4]);
    if(pi0&&!pi0.name)return 'Não existe o perk '+pi0.n;
    if(pk0){delete st.perks.on[pk0];touch();render();return 'Perk '+(st.perks.names.indexOf(pk0)+1)+', '+pk0+': desmarcado'}
  }
  if(m=q.match(/(peguei|pegou|comprei|perk|bebida|tenho) (o |a )?(.+)/)){
    var pi1=perkByIndex(m[3]),pk=pi1?pi1.name:voicePerk(m[3]);
    if(pi1&&!pi1.name)return 'Não existe o perk '+pi1.n;
    if(pk){st.perks.on[pk]=true;touch();render();return 'Perk '+(st.perks.names.indexOf(pk)+1)+', '+pk+': marcado'}
    var gp=voiceGumName(m[3],false);if(gp)return gp;
  }
  var gb=voiceGumName(q,false,true);if(gb)return gb;
  return '';
}
function buzz(){try{if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(60)}catch(e){}}
function vfix(t){
  return vnorm(t).replace(/\b(raund|raunde|raundi|haund|hound|rond|ronde|rodi|rauni|raudi|ran|raun|round de)\b/g,'round').replace(/\b(proximu|prossimo|proxmo|proximo)\b/g,'proximo').replace(/\b(proxima rodada)\b/g,'proximo round').replace(/\b(pasou|pasa|pasu|passo)\b/g,'passou');
}
function voiceHear(alts,interim){
  var qs=alts.map(vfix).filter(Boolean);
  if(!qs.length)return;
  var now=Date.now();
  if(interim){
    /* resultado parcial: só reage rápido ao comando de avançar round */
    if(!st.timer)return;
    for(var k=0;k<qs.length;k++){
      if(isAdvance(qs[k])&&!/\b(round|rodada)\s+\S*\d/.test(qs[k])&&!(ptNum((qs[k].match(/\b(?:round|rodada)\s+(.+)$/)||[])[1]||'')!=null)){
        voice.lastTx=qs[k];voice.lastAt=now;
        var f0='';try{f0=voiceCmd(qs[k])}catch(e){}
        if(f0){buzz();toast(f0);voiceSet('')}
        return;
      }
    }
    return;
  }
  if(qs[0]===voice.lastTx&&now-voice.lastAt<1500)return;
  voice.lastTx=qs[0];voice.lastAt=now;
  var fb='';
  for(var i=0;i<qs.length&&!fb;i++){try{fb=voiceCmd(qs[i])}catch(e){fb=''}}
  if(fb){buzz();toast(fb);voiceSet('')}
  else voiceSet('Ouvi: “'+alts[0]+'” (sem comando)');
}
function voiceStart(){
  if(!SR){toast('Este navegador não tem comando de voz. Use o Chrome.');voice.on=false;return}
  if(voice.rec)return;
  var r=new SR();
  r.lang='pt-BR';r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
  r.onresult=function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res=e.results[i];
      var alts=[];for(var j=0;j<res.length;j++)alts.push(res[j].transcript);
      voiceHear(alts,!res.isFinal);
    }
  };
  r.onstart=function(){voice.started=true;if(!voice.msg||/Ouvindo|Iniciando/.test(voice.msg))voiceSet('Microfone ligado. Diga um comando.')};
  r.onsoundstart=function(){voiceSet('Escutando…')};
  r.onerror=function(e){
    var c=e&&e.error;
    if(c==='not-allowed'){voice.on=false;voiceSet('Microfone bloqueado. Toque no cadeado ao lado do endereço do site, escolha Permissões e libere o Microfone. Depois ligue a voz de novo.');render()}
    else if(c==='service-not-allowed'){voice.on=false;voiceSet('O Chrome não liberou o reconhecimento de voz neste aparelho. Confira se o app Google está atualizado e se o ditado por voz está ativado no teclado.');render()}
    else if(c==='audio-capture'){voice.on=false;voiceSet('Nenhum microfone disponível. Feche outros apps que usam o microfone e tente de novo.');render()}
    else if(c==='network')voiceSet('Sem internet: o reconhecimento de voz precisa de conexão.');
    else if(c&&c!=='no-speech'&&c!=='aborted')voiceSet('Erro de voz: '+c);
  };
  r.onend=function(){
    voice.rec=null;
    if(!voice.on||document.visibilityState!=='visible')return;
    var now=Date.now();
    voice.starts=voice.starts.filter(function(x){return now-x<8000});
    voice.starts.push(now);
    if(voice.starts.length>8){voice.on=false;voiceSet('Voz desligada: o microfone ficou reiniciando. Toque em Voz para ligar de novo.');render();return}
    setTimeout(voiceStart,250);
  };
  voice.rec=r;voice.started=false;wakeOn();
  try{r.start()}catch(e){voice.rec=null;voiceSet('Não foi possível iniciar o microfone: '+(e&&e.message||e))}
  clearTimeout(voice.chk);
  voice.chk=setTimeout(function(){if(voice.on&&voice.rec===r&&!voice.started)voiceSet('O microfone não iniciou. Confira se o Chrome pediu permissão e se você está no site (e não dentro de outro app).')},5000);
}
var wake=null;
function wakeOn(){try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null})}).catch(function(){})}catch(e){}}
function wakeOff(){try{if(wake){wake.release();wake=null}}catch(e){}}
function voiceStop(){
  wakeOff();
  voice.on=false;
  var r=voice.rec;voice.rec=null;
  if(r){r.onend=null;try{r.stop()}catch(e){}}
}
function voiceBtn(){
  if(!SR)return '<p class="hint">Comando de voz indisponível aqui. Abra o app pelo Chrome, pelo endereço do site ou pelo ícone na tela inicial. Dentro do app do Claude e em outros navegadores ele não funciona.</p>';
  return '<div class="row2"><button type="button" class="btn ghost voice-b'+(voice.on?' on':'')+'" data-act="voice-toggle" aria-pressed="'+voice.on+'">Voz: '+(voice.on?'ligada':'desligada')+'</button><button type="button" class="btn ghost" data-act="voice-help">Comandos</button></div><p class="hint" id="voice-st" role="status">'+esc(voice.msg)+'</p>';
}
function voiceHelp(){
  openSheet('<h2>Comandos de voz</h2><p class="hint">Fale perto do microfone, em português. Funciona só com internet. Com a voz ligada, a tela fica acesa e o celular vibra quando entende um comando. Para ouvir melhor: use fone com microfone, fale curto e claro, e abaixe o volume do jogo. Com o jogo alto ou chat de voz, ele pode errar ou entender coisas que você não pediu.</p>'+
    '<ul class="vhelp"><li><b>Avançar round:</b> “próximo round”, “passou”, “passa”, “passou round”, “passa round”, “avançar”, “próximo”, “seguinte”, “novo round”, “round acabou”, “terminou”, “vai”, “bora”, “mais um”. Qualquer frase com “round” e “passou”, “acabou” ou “terminou” também vale.</li><li><b>“round 50”</b>, “rodada sessenta”, “ir para o round 75”: vai direto para esse round</li><li><b>“voltar round”</b>: volta um round</li><li><b>“pausar”</b> e <b>“retomar”</b></li>'+
    '<li><b>“chiclete 3”</b>: marca o chiclete 3 do pack (do 1 ao 5)</li><li>“chiclete 3 X” ou “chiclete 3 confere”</li><li>“desmarcar chiclete 3”</li><li><b>Pelo nome:</b> diga o nome do chiclete em português, como “Sempre Feito Rapidamente”, ou “usei Coagulante” (com “X” ou “confere” no final, se quiser). Só vale para os chicletes que estão no pack. “Desmarcar Coagulante” tira a marca.</li><li>“modo X” e “modo confere”: como marcar por padrão</li>'+
    '<li><b>“peguei perk 1”</b>, “peguei perk 2”…: marca o perk pelo número (o número aparece no canto de cada perk)</li><li>“peguei Juggernog”, “perk Speed Cola”: marca pelo nome</li><li>“perdi perk 1” ou “perdi Juggernog”: desmarca</li>'+
    '<li>“abrir chicletes”, “abrir perks”, “abrir mapa”, “fechar”</li><li>“iniciar partida”: depois de escolher o mapa</li><li><b>“finalizar partida”</b>, depois “confirmar”</li></ul>'+
    '<div class="btns"><button type="button" class="btn primary" data-act="close">Fechar</button></div>',function(){},'view');
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&voice.on&&!voice.rec)voiceStart();
});
['caderno-rounds-apikey','caderno-rounds-model','caderno-rounds-chat'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});


ui.hud=!!st.timer;
render();setSync('local');
initDb();
})();
</script>
